<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M100 12 C145 12 182 28 182 68 C182 128 135 172 100 188 C65 172 18 128 18 68 C18 28 55 12 100 12 Z" 
        fill="url(#gradEmerald)" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        filter="url(#shadow)" />

  <!-- Inner Gold Ring / Border -->
  <path d="M100 24 C138 24 170 38 170 72 C170 122 130 160 100 174 C70 160 30 122 30 72 C30 38 62 24 100 24 Z" 
        fill="none" 
        stroke="url(#gradGold)" 
        stroke-width="3" 
        stroke-dasharray="6,3" />

  <!-- Center Tree / Sprout Emblem -->
  <!-- Mountain Silhouette in Background -->
  <path d="M50 115 L80 80 L105 105 L130 75 L155 115 Z" fill="#065F46" opacity="0.6"/>

  <!-- Golden Sun -->
  <circle cx="100" cy="72" r="16" fill="url(#gradGold)" />

  <!-- Circular Eco Leaves (Circular Economy Bank Sampah) -->
  <path d="M100 76 C85 92 82 118 100 134 C118 118 115 92 100 76 Z" fill="#34D399" />
  <path d="M100 95 C90 106 88 120 100 132 C112 120 110 106 100 95 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M100 102 L100 132" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

  <!-- Rice/Padi & Cotton Garland on Base -->
  <path d="M45 125 Q70 148 100 152 Q130 148 155 125" fill="none" stroke="url(#gradGold)" stroke-width="4" stroke-linecap="round"/>

  <!-- Village Text Ribbon / Banner -->
  <rect x="36" y="146" width="128" height="22" rx="6" fill="#064E3B" stroke="#FBBF24" stroke-width="1.5" />
  <text x="100" y="161" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    MEKARJAYA
  </text>
</svg>
